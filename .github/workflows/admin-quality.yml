name: Admin quality

on:
  pull_request:
    branches: [master]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-quality.yml'
  push:
    branches: [master]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-quality.yml'

jobs:
  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: admin
        run: npm install --no-audit --no-fund

      - name: TypeScript and build
        working-directory: admin
        run: npm run build
