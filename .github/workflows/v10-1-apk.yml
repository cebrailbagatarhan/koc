name: V10.1 Standalone APK

on:
  push:
    branches:
      - build-v10-1-apk
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit

  build-apk:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          NODE_ENV: production
      - name: Build ARM64 standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          NODE_ENV: production
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Koc-v10.1-answer-mask-arm64-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koc-v10.1-answer-mask-arm64-release-apk
          path: Koc-v10.1-answer-mask-arm64-release.apk
          retention-days: 30
