name: Android Latest ARM64 APK

on:
  push:
    branches:
      - latest-test-apk-v8
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Build ARM64 standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Koc-latest-v8-arm64-release.apk
          sha256sum dist/Koc-latest-v8-arm64-release.apk > dist/Koc-latest-v8-arm64-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koc-latest-v8-arm64-release-apk
          path: |
            dist/Koc-latest-v8-arm64-release.apk
            dist/Koc-latest-v8-arm64-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
